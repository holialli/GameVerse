# Gitleaks configuration for GameVerse.
#
# Why this file exists: the public API documentation page shows how to send an
# API key, and gitleaks' `curl-auth-header` rule matched the literal
# `YOUR_API_KEY` placeholder in that example - a false positive that failed the
# very first pipeline step and skipped every later job (tests, Snyk, Docker
# build, Trivy, deploy). Rewording each example one at a time is not a durable
# fix: the next auth example added to the docs fails the same way.
#
# This deliberately extends the default ruleset rather than redefining any rule,
# so detection strength is unchanged - it only exempts lines whose "secret" is a
# recognisable documentation placeholder. A real credential on a line without
# one of these markers still fails the build.

[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and generated/vendored files"

# Paths that only ever contain vendored or build output.
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)node_modules/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
]

# Matched against the whole offending line. Each pattern is an explicit
# "this is a placeholder, not a value" marker - do not add anything here that
# could plausibly appear next to a genuine credential.
regexTarget = "line"
regexes = [
  '''YOUR_API_KEY''',
  '''YOUR_TOKEN''',
  '''YOUR_SECRET''',
  '''\$\{?[A-Z_]*API_KEY\}?''',
  '''<[a-zA-Z_-]*[aA][pP][iI][_-]?[kK][eE][yY]>''',
  '''(?i)replace[_-]?me''',
  '''(?i)example[_-]?key''',
]
