# GameVerse Nginx Configuration for Performance & Caching
# This configuration optimizes TTFB, caching hit ratio, and performance metrics
# Copy this to /home/ubuntu/nginx.conf for production deployment

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  # Performance: Compression, memory efficiency
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Gzip compression for assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/javascript application/json;

  # Upstream backend servers
  upstream backend {
    server gv-api:5000 max_fails=5 fail_timeout=30s;
    keepalive 32;
  }

  upstream frontend {
    server gv-ui:3000 max_fails=5 fail_timeout=30s;
    keepalive 32;
  }

  # HTTP redirect to HTTPS
  server {
    listen 80;
    server_name game-verse.tech www.game-verse.tech;
    return 301 https://$server_name$request_uri;
  }

  # Main HTTPS server block
  server {
    listen 443 ssl http2;
    server_name game-verse.tech www.game-verse.tech;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================================
    # CACHING STRATEGY (Target: 33% -> 80%+ Cache Hit Ratio)
    # ============================================================================

    # 1. API routes - proxied to backend
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Cache API responses if GET and status 200
      proxy_cache_methods GET HEAD;
      proxy_cache_bypass $http_pragma $http_authorization;
      
      # Cache valid responses for 1 hour
      add_header Cache-Control "public, max-age=3600" always;
      expires 1h;
    }

    # 2. Socket.io - NO CACHE
    location /socket.io {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Frontend static assets - LONG CACHE (1 year)
    location /static/ {
      proxy_pass http://frontend/static/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      log_not_found off;
    }

    # 4. Optional assets path - LONG CACHE (1 year)
    location /assets/ {
      proxy_pass http://frontend/assets/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      log_not_found off;
    }

    # 5. Robots.txt - CACHE 1 week
    location = /robots.txt {
      proxy_pass http://frontend/robots.txt;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
    }

    # 6. Sitemap - generated by backend and cacheable at edge
    location = /sitemap.xml {
      proxy_pass http://backend/sitemap.xml;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      add_header Content-Type "application/xml" always;
    }

    # 7. All other requests - proxy to frontend app (SPA fallback handled there)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires -1;
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ============================================================================
    # ERROR HANDLING
    # ============================================================================

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }

    # ============================================================================
    # HEALTH CHECK ENDPOINT
    # ============================================================================

    location = /health {
      access_log off;
      return 200 '{"status":"OK"}';
      add_header Content-Type "application/json";
    }
  }
}
