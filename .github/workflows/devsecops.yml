name: GameVerse DevSecOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/devsecops.yml'
      - '.gitleaks.toml'
      - 'server/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      # Lockfiles must trigger the pipeline too. A dependency patch can change
      # package-lock.json alone, and that is exactly the change most likely to
      # alter the vulnerability surface Snyk gates on - without this entry such
      # a push silently skips every security job. (server/package-lock.json is
      # already covered by the 'server/**' glob above.)
      - 'package-lock.json'

jobs:
# PHASE 1: Automated Security Auditing
  security_validation:
    name: Security Analysis (SCA & Secret Scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Points at the repo config explicitly rather than relying on
          # auto-discovery. It extends the default ruleset and only allowlists
          # documentation placeholders - see .gitleaks.toml for the rationale.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      # New Step: Install Backend dependencies for Snyk
      - name: Install Backend Dependencies
        run: |
          cd server
          npm install

      - name: Run Backend Tests
        run: |
          cd server
          npm test

      - name: Snyk Vulnerability Scan (Backend)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=server/package.json --severity-threshold=critical

      # New Step: Install Frontend dependencies for Snyk
      - name: Install Frontend Dependencies
        run: npm install

      - name: Snyk Vulnerability Scan (Frontend)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=package.json --severity-threshold=critical
  # PHASE 2: Containerization & Registry Sync
  build_and_push:
    name: Container Build & Image Scanning
    needs: security_validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Docker Hub Authentication
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BACKEND: Build, Scan, and Push
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest ./server

      - name: Trivy CVE Scan (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend to Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest

      # FRONTEND: Build, Scan, and Push
      - name: Build Frontend Image
        run: docker build --build-arg REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} -t ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest .

      - name: Trivy CVE Scan (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend to Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest

  # PHASE 3: Deploy the scanned commit to Render (free web service)
  # Render's own auto-deploy is off, so nothing ships until the gates above pass.
  # Needs: secret RENDER_DEPLOY_HOOK_URL (service Settings -> Deploy Hook),
  # variable PRODUCTION_API_URL (e.g. https://gameverse-api.onrender.com), and
  # optionally variable PRODUCTION_SITE_URL (the Vercel frontend) for ZAP.
  orchestrated_deployment:
    name: Render Production Deployment
    needs: build_and_push
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - name: Trigger Render Deploy
        id: trigger
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$API_URL" ]; then
            echo "::warning::Deploy skipped - set the RENDER_DEPLOY_HOOK_URL secret and the PRODUCTION_API_URL variable"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ref= pins the deploy to the exact commit that passed the scans,
          # not whatever is newest on main by the time the hook fires.
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" -o /dev/null
          echo "Deploy of $GITHUB_SHA requested"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # A free instance may be asleep and a Docker build takes several minutes,
      # so poll until /api/health reports this commit (RENDER_GIT_COMMIT) rather
      # than accepting the first OK, which would come from the previous deploy.
      - name: Wait for Deployed Commit
        if: steps.trigger.outputs.deployed == 'true'
        run: |
          for i in $(seq 1 60); do
            response=$(curl -s --max-time 90 "$API_URL/api/health" || true)
            commit=$(echo "$response" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "✓ $GITHUB_SHA is live"
              echo "$response" | jq '.'
              exit 0
            fi
            echo "Attempt $i/60: live commit is '${commit:-unknown}', waiting..."
            sleep 15
          done
          echo "✗ Timed out waiting for $GITHUB_SHA to go live"
          exit 1

      - name: ZAP Baseline Scan
        if: steps.trigger.outputs.deployed == 'true'
        uses: zaproxy/action-baseline@v0.12.0
        with:
            target: ${{ vars.PRODUCTION_SITE_URL || vars.PRODUCTION_API_URL }}
            # The default GITHUB_TOKEN can't create issues, and filing scan
            # findings as issues on a public repo isn't wanted anyway. The
            # report is still uploaded as the run's zap_scan artifact.
            allow_issue_writing: false
