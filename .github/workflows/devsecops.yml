name: GameVerse DevSecOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/devsecops.yml'
      - 'server/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'

jobs:
# PHASE 1: Automated Security Auditing
  security_validation:
    name: Security Analysis (SCA & Secret Scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # New Step: Install Backend dependencies for Snyk
      - name: Install Backend Dependencies
        run: |
          cd server
          npm install

      - name: Snyk Vulnerability Scan (Backend)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=server/package.json

      # New Step: Install Frontend dependencies for Snyk
      - name: Install Frontend Dependencies
        run: npm install

      - name: Snyk Vulnerability Scan (Frontend)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=package.json --severity-threshold=critical
  # PHASE 2: Containerization & Registry Sync
  build_and_push:
    name: Container Build & Image Scanning
    needs: security_validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Docker Hub Authentication
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BACKEND: Build, Scan, and Push
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest ./server

      - name: Trivy CVE Scan (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend to Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest

      # FRONTEND: Build, Scan, and Push
      - name: Build Frontend Image
        run: docker build --build-arg REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} -t ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest .

      - name: Trivy CVE Scan (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend to Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest

  # PHASE 3: Automated Deployment via AWS SSM 
  orchestrated_deployment:
    name: AWS Production Deployment
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Cloud Identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Execute Remote Deployment Script (SSM)
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          NGINX_CONF_B64=$(base64 -w 0 server/config/nginx.conf)

          SSM_PARAMETERS=$(cat <<'EOF'
          commands=[
            "sudo docker network create gameverse-net || true",
            "sudo docker rm -f nginx-proxy gv-ui gv-api || true",
            "sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest",
            "sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest",
            "echo '__NGINX_CONF_B64__' | base64 -d | sudo tee /home/ubuntu/nginx.conf >/dev/null",
            "test -f /home/ubuntu/nginx.conf || (echo Missing /home/ubuntu/nginx.conf && exit 1)",
            "test -f /home/ubuntu/cert.pem || (echo Missing /home/ubuntu/cert.pem && exit 1)",
            "test -f /home/ubuntu/key.pem || (echo Missing /home/ubuntu/key.pem && exit 1)",
            "sudo docker run -d --name gv-api --network gameverse-net -e NODE_ENV=production -e USE_AWS_SECRETS=true -e AWS_REGION=ap-south-1 -e AWS_SECRET_NAME=prod/Gameverse ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-backend:latest",
            "sudo docker run -d --name gv-ui --network gameverse-net ${{ secrets.DOCKERHUB_USERNAME }}/gameverse-frontend:latest",
            "sudo docker run -d --name nginx-proxy --network gameverse-net --restart always -p 80:80 -p 443:443 -v /home/ubuntu/nginx.conf:/etc/nginx/nginx.conf:ro -v /home/ubuntu/cert.pem:/etc/nginx/certs/cert.pem:ro -v /home/ubuntu/key.pem:/etc/nginx/certs/key.pem:ro nginx:1.27-alpine",
            "sudo docker image prune -f",
            "sleep 30"
          ]
          EOF
          )

          SSM_PARAMETERS=${SSM_PARAMETERS/__NGINX_CONF_B64__/$NGINX_CONF_B64}

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated rolling update for GameVerse Production" \
            --region "ap-south-1" \
            --parameters "$SSM_PARAMETERS"

      - name: Wait for Health Check
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            echo "Attempt $i/30..."
            response=$(curl -s -k https://game-verse.tech/api/health || true)
            if echo "$response" | grep -q '"status":"OK"'; then
              echo "✓ Backend is ready and responding"
              if echo "$response" | jq -e . >/dev/null 2>&1; then
                echo "$response" | jq '.'
              else
                echo "$response"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "✗ Backend health check timed out"
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
            target: 'https://game-verse.tech'
            token: ${{ secrets.GITHUB_TOKEN }}